name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rindex/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rindex/Cargo.lock', 'rindex/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --manifest-path rindex/Cargo.toml

      - name: Smoke test
        shell: bash
        run: |
          ./rindex/target/release/rindex --help 2>/dev/null || \
          ./rindex/target/release/rindex.exe --help

      - name: Run tests
        run: cargo test --release --manifest-path rindex/Cargo.toml

      - name: Upload binary (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            rindex/target/release/rindex
            rindex/target/release/rindex.exe
          retention-days: 7

  release:
    name: Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        shell: bash
        run: |
          cd artifacts

          # Copy model files into each platform directory
          mkdir -p Linux/models/c2llm-static-256 macOS/models/c2llm-static-256 Windows/models/c2llm-static-256
          cp ../rindex/share/rindex/models/c2llm-static-256/* Linux/models/c2llm-static-256/
          cp ../rindex/share/rindex/models/c2llm-static-256/* macOS/models/c2llm-static-256/
          cp ../rindex/share/rindex/models/c2llm-static-256/* Windows/models/c2llm-static-256/

          # Linux
          mv Linux/rindex rindex-x86_64-linux
          tar czf rindex-x86_64-linux.tar.gz rindex-x86_64-linux models/

          # macOS
          mv macOS/rindex rindex-x86_64-darwin
          tar czf rindex-x86_64-darwin.tar.gz rindex-x86_64-darwin models/

          # Windows
          mv Windows/rindex.exe rindex-x86_64-windows.exe
          zip -r rindex-x86_64-windows.zip rindex-x86_64-windows.exe models/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: rindex ${{ github.ref_name }}
           body: |
             ## rindex ${{ github.ref_name }}

             ### 下载

             | 平台 | 文件 |
             |------|------|
             | Linux (x86_64) | `rindex-x86_64-linux.tar.gz` |
             | macOS (x86_64) | `rindex-x86_64-darwin.tar.gz` |
             | Windows (x86_64) | `rindex-x86_64-windows.zip` |

             ### 使用

             解压后，将二进制放到 PATH 中，模型文件放到 `~/.local/share/rindex/models/c2llm-static-256/`。
             或直接运行 `rindex setup --claude` / `rindex setup --opencode` 一键配置。
          files: |
            artifacts/rindex-x86_64-linux.tar.gz
            artifacts/rindex-x86_64-darwin.tar.gz
            artifacts/rindex-x86_64-windows.zip
          draft: true
          prerelease: false
