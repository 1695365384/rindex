[package]
name = "rindex"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Local file index MCP server with semantic search for Claude Code"

[dependencies]
# MCP protocol
rmcp = { version = "1.5", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Static embeddings (no ML framework, just tokenizer + embedding table)
safetensors = "0.4"
tokenizers = "0.23"

# Tree-sitter AST parsing
tree-sitter = ">=0.24, <1"
tree-sitter-rust = ">=0.20, <1"
tree-sitter-python = ">=0.20, <1"
tree-sitter-javascript = ">=0.20, <1"
tree-sitter-typescript = ">=0.20, <1"
tree-sitter-go = ">=0.20, <1"

# Storage
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }

# File watching
notify = "7.0"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
dirs = "6.0"
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"
lru = "0.18.0"
once_cell = "1.21.4"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
rayon = "1.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "walker_bench"
harness = false
