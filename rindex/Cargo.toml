[package]
name = "rindex"
version = "0.1.0"
edition = "2021"
description = "Local file index MCP server with semantic search"

[dependencies]
# MCP protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ML (candle)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
hf-hub = "0.4"
tokenizers = "0.21"

# Tree-sitter AST parsing
tree-sitter = ">=0.24, <1"
tree-sitter-rust = ">=0.20, <1"
tree-sitter-python = ">=0.20, <1"
tree-sitter-javascript = ">=0.20, <1"
tree-sitter-typescript = ">=0.20, <1"
tree-sitter-go = ">=0.20, <1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# File watching
notify = "7.0"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
dirs = "6.0"
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"
lru = "0.18.0"
once_cell = "1.21.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
